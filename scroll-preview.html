<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>当前实验滑条 · 本地试用</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f17;color:#e8edf7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{display:flex;align-items:flex-start;justify-content:center;gap:52px;padding:32px 20px}
.notes{width:300px;padding-top:70px}.label{color:#22d3a5;font-size:12px;letter-spacing:.12em}
h1{font-size:29px;line-height:1.45;letter-spacing:-.03em;margin:16px 0}p{font-size:14px;line-height:1.9;color:#93a1bd;margin:18px 0}
strong{color:#e8edf7}a{color:#22d3a5;text-underline-offset:4px}.foot{font-size:12px;border-top:1px solid #26314a;padding-top:18px}
iframe{width:390px;height:844px;max-width:100%;border:1px solid #26314a;border-radius:18px;background:#0b0f17;box-shadow:0 16px 48px #0005;flex:none}
@media(max-width:780px){main{flex-direction:column;align-items:center;gap:20px;padding:18px 10px}.notes{width:390px;max-width:100%;padding:0}h1{font-size:23px;margin:8px 0}p{margin:10px 0}.foot{display:none}iframe{height:calc(100svh - 190px);min-height:500px;border-radius:10px}}
</style>
</head>
<body><main>
  <section class="notes">
    <span class="label">LOCAL PREVIEW · 本地试用</span>
    <h1>只滑动内容，<br>不切换实验。</h1>
    <p>按住手机画面<strong>右侧半透明「↕」短手柄</strong>，向上拖动查看下方内容；向下拖动返回。手柄不表示进度，只负责滚动内容。</p>
    <p>目前可试用初中物理<strong>实验 1、35、41</strong>，从顶部 ☰ 目录选择。其他实验暂不显示滑条。</p>
    <p><strong>拖手柄看内容，点按钮换实验。</strong><br>右下角 ↑ ↓ 切换实验，顶部 ☰ 打开目录。左侧不再设手势区。</p>
    <p class="foot">电脑预览将鼠标拖动接入同一套触摸逻辑，不改变正式站。尚未发布，也未进行手机真机验收。<br><a href="/?base=/HTML-/" target="_blank" rel="noopener">打开原始自适应预览</a></p>
  </section>
  <iframe title="390 像素手机尺寸实验馆预览" src="/index.html?base=/HTML-/&amp;preview-touch=1"></iframe>
</main></body></html>
