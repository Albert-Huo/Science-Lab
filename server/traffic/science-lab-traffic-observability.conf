# Install as science-lab-traffic.service.d/observability.conf after recording the real collection start.
[Service]
ExecStart=
ExecStart=/usr/bin/flock -n /var/lib/science-lab-traffic/update.lock /opt/science-lab-runtime/node-v22.23.2-linux-x64/bin/node /opt/science-lab-traffic/traffic-dashboard.cjs --log-dir /var/log/nginx --ai-log-dir /var/log/nginx --manifest-file /var/www/science-lab-current/manifest.json --state-dir /var/lib/science-lab-traffic --collection-start 2026-09-07T13:41:00Z --ai-collection-start ${AI_COLLECTION_START} --ai-event-log-dir /var/log/science-lab --ai-event-collection-start ${AI_EVENT_COLLECTION_START}
