# Include inside the existing HTTPS server only.
# The enclosing http context must define science_lab_traffic at 2r/s.
location = /admin/traffic {
    access_log off;
    add_header Cache-Control "no-store, private" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 302 /admin/traffic/;
}
location ^~ /admin/traffic/ {
    auth_basic "Science Lab Statistics";
    auth_basic_user_file /etc/nginx/science-lab-traffic.htpasswd;
    alias /var/lib/science-lab-traffic/www/;
    index index.html;
    autoindex off;
    if ($uri !~ "^/admin/traffic/(index\.html|quota\.json)?$") { return 404; }
    limit_req zone=science_lab_traffic burst=10 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    access_log off;
    add_header Cache-Control "no-store, private, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}
