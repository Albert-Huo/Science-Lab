# Include inside the existing HTTPS server only.
# The enclosing http context must define science_lab_traffic at 2r/s and science_lab_analytics at 10r/s.
location = /api/analytics/events {
    limit_except POST { deny all; }
    client_max_body_size 2k;
    client_body_buffer_size 2k;
    limit_req zone=science_lab_analytics burst=30 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/science-lab-product-analytics.log science_lab_product;

    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host "lab.xingnian.net.cn";
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Length $http_content_length;
    proxy_set_header Cookie "";
    proxy_set_header User-Agent "";
    proxy_set_header Referer "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 1s;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
    proxy_request_buffering on;
    proxy_pass http://127.0.0.1:8970/analytics/events;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /admin/traffic {
    access_log off;
    add_header Cache-Control "no-store, private" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 302 /admin/traffic/;
}
location ^~ /admin/traffic/ {
    auth_basic "Science Lab Statistics";
    auth_basic_user_file /etc/nginx/science-lab-traffic.htpasswd;
    alias /var/lib/science-lab-traffic/www/;
    index index.html;
    autoindex off;
    if ($uri !~ "^/admin/traffic/(index\.html|quota\.json|analytics\.json)?$") { return 404; }
    limit_req zone=science_lab_traffic burst=10 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    access_log off;
    add_header Cache-Control "no-store, private, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}
