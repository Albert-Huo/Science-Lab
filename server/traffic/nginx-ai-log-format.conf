# Include once inside the nginx http context, before the Science Lab server blocks.
log_format science_lab_ai escape=json '{"time":"$time_iso8601","status":"$status","duration":"$request_time","bytes":"$body_bytes_sent","experiment":"$upstream_http_x_science_lab_ai_experiment","messages":"$upstream_http_x_science_lab_ai_messages","inputChars":"$upstream_http_x_science_lab_ai_input_chars","quotaScope":"$upstream_http_x_ai_quota_scope","upstreamStatus":"$upstream_status"}';
